# 每天检查官方 3X-UI 有没有发新版本：有就合并到本仓库（保留我们的修改），打 vX.Y.Z-k1 标签并编译发布，
# 服务器上 x-ui update / 面板里的“更新”就能拿到“官方新版 + 我们的修改”。
# 两边改了同一段代码时以官方为准，并开 Issue 列出被官方覆盖的文件；合并后编译不过则不发布、开 Issue 通知。
name: sync-upstream
on:
  schedule:
    - cron: "23 21 * * *"
  push:
    branches: [main]
    paths: [".github/release-tag"]     # 改这个文件 = 用里面写的版本号重新发布本仓库的修改
  workflow_dispatch:
    inputs:
      tag:
        description: "手动指定要发布的版本标签（留空=官方最新版）"
        required: false
permissions:
  contents: write
  actions: write
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 合并官方最新版本
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          trap 'echo "::error::同步失败：$BASH_COMMAND"' ERR
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          # Locale JSON is merged key by key (.gitattributes), so both sides adding strings never conflicts.
          git config merge.jsonkeys.driver "python3 .github/scripts/merge-json-keys.py %O %A %B"
          git remote add upstream https://github.com/MHSanaei/3x-ui.git
          git fetch upstream --tags --force
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=$(tr -d ' \r\n' < .github/release-tag)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UP="${{ github.event.inputs.tag }}"
          if [ -z "$UP" ]; then
            UP=$(gh api repos/MHSanaei/3x-ui/releases/latest -q .tag_name)
          fi
          [ -n "$UP" ] || { echo "::error::取不到官方版本号"; exit 1; }
          echo "$UP" > "$RUNNER_TEMP/upstream-tag.txt"
          case "$UP" in *-k*) echo "tag=$UP" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          git rev-parse -q --verify "refs/tags/$UP" >/dev/null || { echo "::error::官方没有 $UP 这个版本"; exit 1; }
          if git merge-base --is-ancestor "refs/tags/$UP" HEAD; then
            echo "已经包含官方 $UP，无需同步"; exit 0
          fi
          if ! git merge --no-edit "refs/tags/$UP"; then
            # 两边改了同一段代码：记下冲突文件，按用户要求以官方代码为准重新合并。
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/overridden.txt"
            git merge --abort
            MERGE_PREFER_THEIRS=1 git merge --no-edit -X theirs "refs/tags/$UP" || true
            # -X theirs 处理不了的（一边删了文件、另一边改了）同样以官方为准。
            for f in $(git diff --name-only --diff-filter=U); do
              if git cat-file -e "refs/tags/$UP:$f" 2>/dev/null; then
                git checkout --theirs -- "$f" && git add -- "$f"
              else
                git rm -q -- "$f"
              fi
            done
            if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              git commit --no-edit
            fi
            echo "overridden=1" >> "$GITHUB_OUTPUT"
          fi
          TAG="$UP-k1"
          echo "$TAG" > .github/release-tag
          git add .github/release-tag
          git commit -m "release: $TAG (官方 $UP + 本仓库修改)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "merged=1" >> "$GITHUB_OUTPUT"
      # 合并结果先编译一遍，编译不过就不推送、不发布，避免服务器更新到坏版本。
      - uses: actions/setup-go@v5
        if: steps.merge.outputs.merged == '1'
        with:
          go-version-file: go.mod
          cache: true
      - name: 编译检查
        if: steps.merge.outputs.merged == '1'
        run: |
          make dist-stub
          go build ./...
          go vet ./internal/... > "$RUNNER_TEMP/vet.txt" 2>&1 || { cat "$RUNNER_TEMP/vet.txt"; exit 1; }
      - name: 推送并发布
        if: steps.merge.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.merge.outputs.tag }}
        run: |
          set -e
          if [ "${{ steps.merge.outputs.merged }}" = "1" ]; then
            git push origin HEAD:main
          fi
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          # GITHUB_TOKEN 推的标签不会自动触发编译，这里手动触发
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref "$TAG"
      - name: 记录被官方覆盖的文件
        if: success() && steps.merge.outputs.overridden == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP=$(cat "$RUNNER_TEMP/upstream-tag.txt")
          FILES=$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/overridden.txt")
          BODY=$(printf '同步官方 %s 时，下面这些文件两边改了同一段代码，已按规则以官方代码为准，编译检查已通过并已发布。\n\n这些文件里本仓库的修改可能被官方版本替换，相关功能请留意：\n%s\n\n运行记录：%s/%s/actions/runs/%s' "$UP" "$FILES" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh label create sync-overridden --color FBCA04 --description "同步时以官方代码覆盖了冲突" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh issue create -R "$GITHUB_REPOSITORY" --label sync-overridden --title "同步官方 $UP：冲突处已采用官方代码" --body "$BODY"
      # A failed sync must not go unnoticed: one open issue (GitHub emails the owner) until a sync succeeds.
      - name: 同步失败时开 Issue 通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP=$(cat "$RUNNER_TEMP/upstream-tag.txt" 2>/dev/null || echo "官方新版")
          DETAIL=$(head -c 3000 "$RUNNER_TEMP/vet.txt" 2>/dev/null || true)
          BODY=$(printf '自动同步官方 3X-UI %s 失败，没有发布，服务器暂时收不到这个版本。\n\n%s\n\n运行记录：%s/%s/actions/runs/%s\n\n处理好后重新运行 sync-upstream，成功后这条 Issue 会自动关闭。' "$UP" "${DETAIL:-（原因见运行记录，常见是合并后编译不通过）}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh label create sync-failed --color B60205 --description "自动同步官方版本失败" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          NUM=$(gh issue list -R "$GITHUB_REPOSITORY" --label sync-failed --state open --json number -q '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label sync-failed --title "同步官方 3X-UI $UP 失败，需要处理" --body "$BODY"
          fi
      - name: 同步成功后关闭失败 Issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for NUM in $(gh issue list -R "$GITHUB_REPOSITORY" --label sync-failed --state open --json number -q '.[].number'); do
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY" --comment "同步已成功，自动关闭。"
          done
