# 每天检查官方 3X-UI 有没有发新版本：有就合并到本仓库（保留我们的修改），打 vX.Y.Z-k1 标签并编译发布，
# 服务器上 x-ui update / 面板里的“更新”就能拿到“官方新版 + 我们的修改”。合并冲突时会失败并发邮件提醒。
name: sync-upstream
on:
  schedule:
    - cron: "23 21 * * *"
  push:
    branches: [main]
    paths: [".github/release-tag"]     # 改这个文件 = 用里面写的版本号重新发布本仓库的修改
  workflow_dispatch:
    inputs:
      tag:
        description: "手动指定要发布的版本标签（留空=官方最新版）"
        required: false
permissions:
  contents: write
  actions: write
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 合并官方最新版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          trap 'echo "::error::同步失败：$BASH_COMMAND"' ERR
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          # Locale JSON is merged key by key (.gitattributes), so both sides adding strings never conflicts.
          git config merge.jsonkeys.driver "python3 .github/scripts/merge-json-keys.py %O %A %B"
          git remote add upstream https://github.com/MHSanaei/3x-ui.git
          git fetch upstream --tags --force
          # 官方版本 vX.Y.Z 合并后发布为 vX.Y.Z-k1；我们自己的改动由 .github/release-tag 发布 -k2、-k3…
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG=$(tr -d ' \r\n' < .github/release-tag)
          else
            UP="${{ github.event.inputs.tag }}"
            if [ -z "$UP" ]; then
              UP=$(gh api repos/MHSanaei/3x-ui/releases/latest -q .tag_name)
            fi
            [ -n "$UP" ] || { echo "::error::取不到官方版本号"; exit 1; }
            case "$UP" in
              *-k*) TAG="$UP" ;;
              *)
                git rev-parse -q --verify "refs/tags/$UP" >/dev/null || { echo "::error::官方没有 $UP 这个版本"; exit 1; }
                if git merge-base --is-ancestor "refs/tags/$UP" HEAD; then
                  echo "已经包含官方 $UP，无需同步"; exit 0
                fi
                if ! git merge --no-edit "refs/tags/$UP"; then
                  git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
                  echo "$UP" > "$RUNNER_TEMP/upstream-tag.txt"
                  git merge --abort
                  echo "::error::合并 $UP 有冲突，需要人工处理：$(tr '\n' ' ' < "$RUNNER_TEMP/conflicts.txt")"
                  exit 1
                fi
                TAG="$UP-k1"
                echo "$TAG" > .github/release-tag
                git add .github/release-tag
                git commit -m "release: $TAG (官方 $UP + 本仓库修改)"
                git push origin HEAD:main
                ;;
            esac
          fi
          [ -n "$TAG" ] || { echo "::error::版本号为空"; exit 1; }
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          # GITHUB_TOKEN 推的标签不会自动触发编译，这里手动触发
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref "$TAG"
      # A failed sync must not go unnoticed: one open issue (GitHub emails the owner) until a sync succeeds.
      - name: 同步失败时开 Issue 通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP=$(cat "$RUNNER_TEMP/upstream-tag.txt" 2>/dev/null || echo "官方新版")
          FILES=$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt" 2>/dev/null || true)
          BODY=$(printf '自动同步官方 3X-UI %s 失败，服务器暂时收不到这个版本。\n\n冲突文件：\n%s\n\n运行记录：%s/%s/actions/runs/%s\n\n处理好后重新运行 sync-upstream，成功后这条 Issue 会自动关闭。' "$UP" "${FILES:-（见运行记录）}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh label create sync-failed --color B60205 --description "自动同步官方版本失败" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          NUM=$(gh issue list -R "$GITHUB_REPOSITORY" --label sync-failed --state open --json number -q '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label sync-failed --title "同步官方 3X-UI $UP 失败，需要处理" --body "$BODY"
          fi
      - name: 同步成功后关闭失败 Issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for NUM in $(gh issue list -R "$GITHUB_REPOSITORY" --label sync-failed --state open --json number -q '.[].number'); do
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY" --comment "同步已成功，自动关闭。"
          done
