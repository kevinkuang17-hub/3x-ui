# Temporary: surfaces failing Go test output as annotations (job logs are not reachable from the dev sandbox).
name: debug-tests
on:
  push:
    branches: ["dev/**"]
env:
  PKGS: "./internal/web/service/ ./internal/web/ ./internal/sub/ ./internal/decoy/ ./internal/panelaccess/ ./internal/web/controller/"
  RUN: "."
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub dist
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Test
        run: |
          set +e
          go test -count=1 -run "$RUN" $PKGS > out.txt 2>&1
          code=$?
          grep -E -- "--- FAIL|FAIL|panic|_test.go:[0-9]+|Error|\.go:[0-9]+:" out.txt | head -120 > fail.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' fail.txt)
          echo "::error title=go test::${msg}"
          exit $code
