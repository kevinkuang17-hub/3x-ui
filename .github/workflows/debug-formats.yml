# Temporary (dev branch only): checks generated sing-box and Xray profiles with the real cores.
name: debug-formats
on:
  push:
    branches: ["dev/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Samples
        run: |
          mkdir -p internal/web/dist samples && touch internal/web/dist/.gitkeep
          FORMAT_SAMPLES_DIR=$PWD/samples go test -count=1 -run 'TestRenderSingbox|TestJsonSubscriptionCarriesLibrary' ./internal/sub/ > test.txt 2>&1 || true
          ls samples
      - name: Cores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release download -R SagerNet/sing-box -p '*-linux-amd64.tar.gz' -D sb
          tar xzf sb/*.tar.gz -C sb
          SB=$(find sb -name sing-box -type f | head -1)
          gh release download -R XTLS/Xray-core -p 'Xray-linux-64.zip' -D xr
          (cd xr && unzip -q Xray-linux-64.zip)
          { echo "== go test"; tail -20 test.txt; echo "== sing-box $($SB version | head -1)"; $SB check -c samples/singbox.json 2>&1; echo "exit $?";
            echo "== xray"; XRAY_LOCATION_ASSET=$PWD/xr xr/xray run -test -c samples/xray.json 2>&1 | tail -15; echo "exit ${PIPESTATUS[0]}"; } > result.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' result.txt)
          echo "::error title=formats::${msg}"
