<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
:root { color-scheme: light dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f5f7; color: #2b2f36; }
@media (prefers-color-scheme: dark) { body { background: #17191d; color: #e3e5e8; } .box { background: #202329 !important; } }
.box { background: #fff; padding: 40px 44px; border-radius: 12px; max-width: 460px; margin: 20px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
h1 { margin: 0 0 12px; font-size: 24px; }
p { margin: 0; color: #6b7280; line-height: 1.6; }
</style>
</head>
<body>
<div class="box">
<h1>{{.Title}}</h1>
<p>{{.Tagline}}{{if .Email}} For urgent matters: <a href="mailto:{{.Email}}">{{.Email}}</a>{{end}}</p>
</div>
</body>
</html>
